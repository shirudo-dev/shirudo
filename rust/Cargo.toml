[package]
name = "shirudo"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"
publish = false

# Each crate is vendored in rust/vendor and pinned in Cargo.lock, which
# .cargo/config.toml takes it from, so that cargo builds offline.
[dependencies]
# The ESYS, TCTI loader and marshalling calls of tpm2-tss, through the
# Parsec project's bindings, with their prebuilt Linux bindings.
tss-esapi-sys = { version = "0.5", default-features = false }
# The C library, through the rust-lang bindings (rust/src/sys/libc.rs).
libc = { version = "0.2", default-features = false }
# Inflate and deflate for gzip (rust/src/util/gzip.rs), in place of zlib.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# libcrypto and libssl, the system's or the static target's, through the
# crate's safe types; openssl-sys for the calls it has no wrapper for, and
# foreign-types to cross between the two.
openssl = { version = "0.10", default-features = false }
openssl-sys = { version = "0.9", default-features = false }
foreign-types = { version = "0.3", default-features = false }

# The C binaries link this archive.
[lib]
name = "shirudo_rs"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
# The test helpers, programs the functional tests run, which make links
# from a build of the archive with them; the shipped one has none.
test-helpers = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# A fuzz build, which logs nothing.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(shirudo_fuzz)', 'cfg(kani)'] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# LTO keeps of std only what the exported functions reach, where the
# prebuilt objects would bring all of themselves. The crate unwinds, for
# a Lua error that crosses a Rust callback; src/panic.rs aborts a panic.
[profile.release]
# Size before speed: the static target must fit the runtime image that
# every boot reads whole through dm-verity, and the crate is not where
# shirudo spends its time.
opt-level = "s"
overflow-checks = true
codegen-units = 1
lto = true
debug = true
