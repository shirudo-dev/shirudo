# Runtime policy for the initial config image.
config.image = /var/lib/shirudo/images/initial
config.verification_key = /run/shirudo/runtime/etc/shirudo/config-cert.der
config.pcr = 13
tpm.tcti = device:/dev/tpmrm0
# Allow classical TLS key exchange for ghcr.io. It does not offer hybrid TLS yet.
tls.classical_hosts = ghcr.io
