#
# Collector for shirudo's keepalive: OTLP over HTTPS in, every log
# record written to ClickHouse's otel.otel_logs, which sql/ creates. Run
# it with otelcol-contrib, which has the ClickHouse exporter. The
# environment may name another certificate, key or ClickHouse server.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: ${env:OTLP_TLS_CERT:-/certs/server.pem}
          key_file: ${env:OTLP_TLS_KEY:-/certs/server.key}
          min_version: "1.3"
exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT:-tcp://clickhouse:9000}
    username: ${env:CLICKHOUSE_USER:-default}
    password: ${env:CLICKHOUSE_PASSWORD:-}
    database: otel
    logs_table_name: otel_logs
    create_schema: false
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
