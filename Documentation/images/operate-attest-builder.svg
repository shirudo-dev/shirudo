<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Enrolling from a builder's records: while it controls the TPM, the builder creates the attestation key and the endorsement key from attest's templates and gives their names to the operator's inventory; every attestation after that is a nonce, the target having the TPM create the same attestation key, quote the PCRs and certify the register, and a verify that pins the builder's names, with no credential challenge</title>
  <style>@media (prefers-color-scheme: dark) { [fill="#5d6675"] { fill: #b4bcc7; } }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <g stroke="#8a93a0" stroke-width="1" stroke-dasharray="3 4">
    <line x1="120" y1="54" x2="120" y2="206"/>
    <line x1="340" y1="54" x2="340" y2="452"/>
    <line x1="570" y1="54" x2="570" y2="490"/>
    <line x1="790" y1="54" x2="790" y2="490"/>
    <line x1="10" y1="206" x2="890" y2="206"/>
  </g>
  <g fill="#8a93a0" fill-opacity="0.08" stroke="#8a93a0" stroke-width="1.5">
    <rect x="45" y="10" width="150" height="44" rx="6" stroke-dasharray="5 4"/>
    <rect x="265" y="10" width="150" height="44" rx="6"/>
    <rect x="495" y="10" width="150" height="44" rx="6"/>
    <rect x="715" y="10" width="150" height="44" rx="6"/>
    <rect x="220" y="452" width="240" height="36" rx="6"/>
  </g>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="104" x2="788" y2="104"/>
    <line x1="790" y1="124" x2="122" y2="124" stroke-dasharray="5 4"/>
    <line x1="120" y1="172" x2="338" y2="172"/>
    <line x1="340" y1="244" x2="568" y2="244"/>
    <line x1="570" y1="282" x2="788" y2="282"/>
    <line x1="570" y1="332" x2="788" y2="332"/>
    <line x1="790" y1="348" x2="572" y2="348" stroke-dasharray="5 4"/>
    <line x1="570" y1="388" x2="788" y2="388"/>
    <line x1="790" y1="404" x2="572" y2="404" stroke-dasharray="5 4"/>
    <line x1="570" y1="436" x2="342" y2="436"/>
  </g>
  <g fill="#5d6675" font-size="12" text-anchor="middle">
    <text x="120" y="30" font-weight="bold" font-size="13">Builder</text>
    <text x="120" y="46" font-size="11">hypervisor or provisioner</text>
    <text x="340" y="30" font-weight="bold" font-size="13">Operator</text>
    <text x="340" y="46" font-size="11">inventory, no TPM</text>
    <text x="570" y="30" font-weight="bold" font-size="13">Target</text>
    <text x="570" y="46" font-size="11" font-family="monospace">shirudo attest</text>
    <text x="790" y="30" font-weight="bold" font-size="13">TPM</text>
    <text x="790" y="46" font-size="11">physical or virtual</text>

    <text x="455" y="96" font-family="monospace">CreatePrimary: AK, EK (attest's templates)</text>
    <text x="455" y="140" font-size="11">their names</text>
    <text x="230" y="164">ak-name, ek-name</text>
    <text x="230" y="190" font-size="11">into the inventory</text>

    <text x="455" y="236">nonce</text>

    <text x="680" y="274">CreatePrimary: AK</text>
    <text x="680" y="298" font-size="11">the name the builder recorded</text>

    <text x="680" y="324" font-family="monospace">Quote(PCRs; nonce)</text>
    <text x="680" y="380" font-family="monospace">NV_Certify(register; nonce)</text>

    <text x="455" y="428">evidence document</text>
    <text x="340" y="475" font-family="monospace">verify --ak-name --ek-name</text>
  </g>
  <g fill="#5d6675" font-size="11">
    <text x="128" y="76">before handover, once</text>
    <text x="128" y="226">every attestation</text>
  </g>
</svg>
