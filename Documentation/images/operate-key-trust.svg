<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Init builds the .bpf keyring from the runtime image's primary certificate and the config image's vouched certificates minus its revocations, and the .dm-verity keyring from the runtime image's config certificates; tree publications verify against the active non-revoked BPF set and package indexes against their repository certificates</title>
  <style>@media (prefers-color-scheme: dark) { [fill="#5d6675"] { fill: #b4bcc7; } }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5">
    <rect x="10" y="40" width="220" height="170" rx="6" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="22" y="94" width="196" height="46" rx="4"/>
    <rect x="22" y="152" width="196" height="46" rx="4"/>
    <rect x="270" y="40" width="220" height="228" rx="6" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="282" y="94" width="196" height="46" rx="4"/>
    <rect x="282" y="152" width="196" height="46" rx="4"/>
    <rect x="282" y="210" width="196" height="46" rx="4"/>
    <rect x="530" y="40" width="220" height="228" rx="6" stroke-dasharray="6 4"/>
    <rect x="542" y="80" width="196" height="104" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="542" y="196" width="196" height="62" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <path d="M218,104 L250,104 L250,24 L510,24 L510,96 L540,96" marker-end="url(#arrow)"/>
    <line x1="478" y1="117" x2="540" y2="117" marker-end="url(#arrow)"/>
    <line x1="478" y1="175" x2="540" y2="160" marker-end="url(#arrow)"/>
    <path d="M218,175 L250,175 L250,290 L640,290 L640,260" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5d6675" font-size="11">
    <g text-anchor="middle">
      <text x="120" y="64" font-size="13">Runtime image</text>
      <text x="120" y="80">dm-verity, root hash in the UKI</text>
      <text x="120" y="114">keys/cert.der</text>
      <text x="120" y="130">runtime primary BPF certificate</text>
      <text x="120" y="172">etc/shirudo/config-cert.der</text>
      <text x="120" y="188">config verification certificates</text>
      <text x="380" y="64" font-size="13">Config image</text>
      <text x="380" y="80">signed, checked against .dm-verity</text>
      <text x="380" y="114">keys/trusted/&lt;name&gt;.der, .vouch</text>
      <text x="380" y="130">vouched BPF certificates</text>
      <text x="380" y="172">keys/revoked/&lt;fingerprint&gt;.der</text>
      <text x="380" y="188">revocation records</text>
      <text x="380" y="230">etc/shirudo/bpm/keys/</text>
      <text x="380" y="246">repository index certificates</text>
      <text x="640" y="64" font-size="13">Kernel keyrings, sealed by init</text>
      <text x="640" y="101" font-size="13">.bpf</text>
      <text x="640" y="119">the primary, each certificate</text>
      <text x="640" y="135">vouched by one already in the set,</text>
      <text x="640" y="151">minus revoked, at most 16</text>
      <text x="640" y="173">checks signed loaders</text>
      <text x="640" y="217" font-size="13">.dm-verity</text>
      <text x="640" y="235">the config certificates</text>
      <text x="640" y="251">checks config images</text>
      <text x="509" y="190">removes</text>
    </g>
    <text x="10" y="320">Tree publications verify against the active BPF signer set, excluding revoked certificates.</text>
    <text x="10" y="338">Package indexes verify against the certificate their repository definition names.</text>
  </g>
</svg>
