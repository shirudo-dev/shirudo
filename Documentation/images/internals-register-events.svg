<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Building the register: in the initrd init defines the NV index under a policy on PCRs 9 and 11, extends the init event, extends PCR 9 with the anchor and writes the init record; every later command extends a tagged event digest and then appends its record to the eventlog</title>
  <style>@media (prefers-color-scheme: dark) { [fill="#5d6675"] { fill: #b4bcc7; } }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <g fill="#8a93a0" fill-opacity="0.08" stroke="#8a93a0" stroke-width="1.5">
    <rect x="90" y="10" width="140" height="44" rx="6"/>
    <rect x="350" y="10" width="140" height="44" rx="6"/>
    <rect x="570" y="10" width="140" height="44" rx="6"/>
    <rect x="750" y="10" width="140" height="44" rx="6"/>
  </g>
  <g stroke="#8a93a0" stroke-width="1" stroke-dasharray="3 4">
    <line x1="160" y1="54" x2="160" y2="365"/>
    <line x1="420" y1="54" x2="420" y2="365"/>
    <line x1="640" y1="54" x2="640" y2="365"/>
    <line x1="820" y1="54" x2="820" y2="365"/>
    <line x1="10" y1="262" x2="890" y2="262"/>
  </g>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="100" x2="638" y2="100"/>
    <line x1="160" y1="145" x2="638" y2="145"/>
    <line x1="160" y1="190" x2="818" y2="190"/>
    <line x1="160" y1="235" x2="418" y2="235"/>
    <line x1="160" y1="305" x2="638" y2="305"/>
    <line x1="160" y1="350" x2="418" y2="350"/>
  </g>
  <g fill="#5d6675" font-size="12" text-anchor="middle">
    <text x="160" y="37" font-weight="bold" font-size="13">shirudo</text>
    <text x="420" y="30" font-weight="bold" font-size="13">eventlog</text>
    <text x="420" y="46" font-size="11" font-family="monospace">/var/lib/shirudo</text>
    <text x="640" y="30" font-weight="bold" font-size="13">TPM NV index</text>
    <text x="640" y="46" font-size="11">the register</text>
    <text x="820" y="37" font-weight="bold" font-size="13">TPM PCR 9</text>

    <text x="400" y="92">NV_DefineSpace, write policy on PCRs 9 and 11</text>
    <text x="400" y="137" font-family="monospace">NV_Extend(init)</text>
    <text x="490" y="182">PCR_Extend(SHA-256(anchor)), the anchor names the index</text>
    <text x="290" y="227">init record, to eventlog.pending</text>

    <text x="400" y="297" font-family="monospace">NV_Extend(SHA-256(tag || fields))</text>
    <text x="290" y="342">append the record</text>
  </g>
  <g fill="#5d6675" font-size="11">
    <text x="10" y="88">initrd, once</text>
    <text x="10" y="103">per TPM boot</text>
    <text x="10" y="290">every later</text>
    <text x="10" y="305">command</text>
    <text x="160" y="388">upatch_load, upatch_unload, tree_op, key_revoke: extend, then append, under eventlog.lock</text>
  </g>
</svg>
