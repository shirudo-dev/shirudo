<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Enrolling through credential activation: the target answers a nonce with enroll.json, carrying the attestation key's name and the endorsement key; the operator makes a challenge for an endorsement key it vouches for; the target answers it with a second nonce, and the TPM releases the credential only to that attestation key under that endorsement key; the operator verifies the credential and records both names</title>
  <style>@media (prefers-color-scheme: dark) { [fill="#5d6675"] { fill: #b4bcc7; } }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <g stroke="#8a93a0" stroke-width="1" stroke-dasharray="3 4">
    <line x1="160" y1="54" x2="160" y2="208"/>
    <line x1="160" y1="254" x2="160" y2="416"/>
    <line x1="470" y1="54" x2="470" y2="530"/>
    <line x1="770" y1="54" x2="770" y2="530"/>
  </g>
  <g fill="#8a93a0" fill-opacity="0.08" stroke="#8a93a0" stroke-width="1.5">
    <rect x="85" y="10" width="150" height="44" rx="6"/>
    <rect x="395" y="10" width="150" height="44" rx="6"/>
    <rect x="695" y="10" width="150" height="44" rx="6"/>
    <rect x="30" y="208" width="260" height="46" rx="6"/>
    <rect x="30" y="416" width="260" height="46" rx="6"/>
    <rect x="30" y="486" width="260" height="44" rx="6"/>
  </g>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="96" x2="468" y2="96"/>
    <line x1="470" y1="132" x2="768" y2="132"/>
    <line x1="770" y1="150" x2="472" y2="150" stroke-dasharray="5 4"/>
    <line x1="470" y1="186" x2="162" y2="186"/>
    <line x1="160" y1="292" x2="468" y2="292"/>
    <line x1="470" y1="330" x2="768" y2="330"/>
    <line x1="770" y1="348" x2="472" y2="348" stroke-dasharray="5 4"/>
    <line x1="470" y1="394" x2="162" y2="394"/>
    <line x1="160" y1="462" x2="160" y2="484"/>
  </g>
  <g fill="#5d6675" font-size="12" text-anchor="middle">
    <text x="160" y="30" font-weight="bold" font-size="13">Operator</text>
    <text x="160" y="46" font-size="11">inventory, no TPM</text>
    <text x="470" y="30" font-weight="bold" font-size="13">Target</text>
    <text x="470" y="46" font-size="11" font-family="monospace">shirudo attest</text>
    <text x="770" y="30" font-weight="bold" font-size="13">TPM</text>
    <text x="770" y="46" font-size="11">physical or virtual</text>

    <text x="315" y="88">nonce</text>
    <text x="620" y="124">CreatePrimary: AK, EK</text>
    <text x="620" y="166" font-size="11">public areas, names, EK certificate</text>
    <text x="315" y="178" font-family="monospace">enroll.json</text>

    <text x="160" y="228" font-family="monospace">attest challenge</text>
    <text x="160" y="245" font-size="11">EK vouched for by --ek-ca or --ek-name</text>

    <text x="315" y="284" font-family="monospace">challenge.json, nonce-2</text>
    <text x="620" y="322">ActivateCredential</text>
    <text x="620" y="364" font-size="11">the credential, only to that AK under that EK</text>
    <text x="315" y="386" font-family="monospace">answer.json</text>

    <text x="160" y="436" font-family="monospace">verify --expect-credential</text>
    <text x="160" y="453" font-size="11">with --ak-name and --ek-name</text>
    <text x="160" y="505" font-family="monospace">inventory: ak-name, ek-name</text>
    <text x="160" y="521" font-size="11">every later verify pins them</text>
  </g>
</svg>
