name: Build kernel-obs BPM package
description: Build a kernel-obs BPM package with preview or production signing

inputs:
  mode:
    description: Either preview or publish
    required: true
  version:
    description: BPM package version
    required: true
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  signing-key-pem:
    description: Production ML-DSA signing key in PEM format
    required: false
  cert-der-b64:
    description: Production signing certificate in base64-encoded DER format
    required: false
  registry-username:
    description: Registry username for production publishing
    required: false
  registry-token:
    description: Registry token for production publishing
    required: false

runs:
  using: composite
  steps:
    - name: Download shirudo operator package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: shirudo-deb
        path: upstream/shirudo-deb

    - name: Download bpf-next kernel header
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bpf-next-vmlinux-h
        path: upstream/bpf-next-vmlinux-h

    - name: Write build inputs
      shell: bash
      env:
        KERNEL_OBS_MODE: ${{ inputs.mode }}
        KERNEL_OBS_VERSION: ${{ inputs.version }}
      run: |
        set -eu
        case "$KERNEL_OBS_MODE" in
        preview|publish) ;;
        *)
          echo "unsupported kernel-obs build mode: $KERNEL_OBS_MODE" >&2
          exit 1
          ;;
        esac
        test -n "$KERNEL_OBS_VERSION"
        install -d -m 0755 build
        printf '%s\n' "$KERNEL_OBS_MODE" > build/kernel-obs-mode
        printf '%s\n' "$KERNEL_OBS_VERSION" > build/kernel-obs-version

    - name: Ensure QEMU is installed
      shell: bash
      run: |
        set -eu
        if ! command -v qemu-system-x86_64 >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --reinstall qemu-system-x86
        fi
        command -v qemu-system-x86_64

    - name: Materialize production signing key
      if: inputs.mode == 'publish'
      shell: bash
      env:
        KERNEL_OBS_SIGNING_KEY_PEM: ${{ inputs['signing-key-pem'] }}
        KERNEL_OBS_CERT_DER_B64: ${{ inputs['cert-der-b64'] }}
      run: |
        set -eu
        keys_dir=.ci/kernel-obs-keys
        test -n "$KERNEL_OBS_SIGNING_KEY_PEM"
        test -n "$KERNEL_OBS_CERT_DER_B64"
        install -d -m 0700 "$keys_dir"
        printf '%s\n' "$KERNEL_OBS_SIGNING_KEY_PEM" > "$keys_dir/signing_key.pem"
        printf '%s' "$KERNEL_OBS_CERT_DER_B64" | base64 --decode > "$keys_dir/cert.der"
        chmod 0600 "$keys_dir/signing_key.pem" "$keys_dir/cert.der"

    - name: Materialize registry credentials
      if: inputs.mode == 'publish'
      shell: bash
      env:
        KERNEL_OBS_REGISTRY_USERNAME: ${{ inputs['registry-username'] }}
        KERNEL_OBS_REGISTRY_TOKEN: ${{ inputs['registry-token'] }}
      run: |
        set -eu
        test -n "$KERNEL_OBS_REGISTRY_USERNAME"
        test -n "$KERNEL_OBS_REGISTRY_TOKEN"
        install -d -m 0700 .ci
        umask 077
        printf '%s\n%s\n' "$KERNEL_OBS_REGISTRY_USERNAME" \
          "$KERNEL_OBS_REGISTRY_TOKEN" > .ci/kernel-obs-registry-credentials

    - name: Prepare preview signer directory
      if: inputs.mode == 'preview'
      shell: bash
      run: install -d -m 0700 .ci/kernel-obs-preview-keys

    - name: Build package in LVH
      uses: cilium/little-vm-helper@c8b0bfbae3bdda7bc69fb9cd370e4b74ce84986d # v0.0.33
      with:
        test-name: shirudo-kernel-obs-${{ inputs.mode }}
        image: kind
        image-version: bpf-next-20260603.072225
        kernel-version: bpf-next-main
        host-mount: ${{ github.workspace }}
        images-folder-parent: ${{ github.workspace }}/../lvh
        install-dependencies: false
        ssh-port: 2222
        cmd: |
          set -eu
          systemctl start host.mount
          /bin/sh /host/.github/scripts/kernel-obs-in-lvh.sh

    - name: Upload preview package and public certificate
      if: inputs.mode == 'preview'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs['artifact-name'] }}
        path: kernel-obs-preview/
        if-no-files-found: error
        retention-days: 14

    - name: Upload published BPM package
      if: always() && inputs.mode == 'publish'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs['artifact-name'] }}
        path: kernel-obs-*.bee
        if-no-files-found: ignore

    - name: Remove signer and registry credentials
      if: always()
      shell: bash
      run: rm -rf .ci/kernel-obs-keys .ci/kernel-obs-preview-keys .ci/kernel-obs-registry-credentials
