version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/lvh"
    schedule:
      interval: "weekly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "docker"
    directory: "/Documentation"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/testing/container"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/Documentation"
    schedule:
      interval: "weekly"
