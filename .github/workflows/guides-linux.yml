name: Linux quickstart

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Optional override; defaults to the run testing/vm/kernel-artifact.sh pins
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guides:
    name: Quickstart and quick guides
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve kernel package artifact
        id: kernel-run
        env:
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
        run: sh .github/scripts/guides-ci.sh kernel-run

      - name: Download kernel CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-packages-x86-64-ci
          repository: shirudo-dev/kernel
          run-id: ${{ steps.kernel-run.outputs.run_id }}
          github-token: ${{ secrets.KERNEL_REPO_READ_TOKEN }}
          path: build/kernel-ci-artifact

      - name: Restore the static target dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/target-deps
          key: target-deps-${{ hashFiles('Makefile.target-deps') }}

      - name: Restore the host OpenSSL toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-openssl
          key: host-openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/vm-toolchain.sh') }}

      - name: Restore the host libtpms toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-libtpms
          key: host-libtpms-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/vm-toolchain.sh', '.github/scripts/install-libtpms.sh') }}

      - name: Restore the VM images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-vm/cache
          key: test-vm-runtime-and-operator-${{ hashFiles('testing/vm/runtime-packages', 'testing/vm/operator-packages', 'testing/vm/prepare-runtime.sh', 'testing/vm/build-bundle.sh', 'testing/vm/arch.sh', '.github/scripts/install-clang.sh', '.github/scripts/install-static-libcrypto-deps.sh', 'testing/container/Containerfile', 'testing/container/packages', 'testing/container/install-go.sh', 'Makefile.target-deps') }}

      - name: Prepare the test environment
        env:
          KERNEL_CI_ARTIFACT_DIR: ${{ github.workspace }}/build/kernel-ci-artifact
        run: .github/scripts/tests.sh setup

      - name: Run the Linux quickstart and quick guides
        id: guides
        timeout-minutes: 40
        run: sh .github/scripts/guides-ci.sh run

      - name: Upload quickstart guest console
        if: failure() && steps.guides.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-console-quickstart
          path: build/test-vm/vms/quickstart/console.log
          if-no-files-found: ignore
