name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    # A newer push to a pull request supersedes its run. Any other run is
    # keyed on its ref and commit, so a merge never cancels another's run.
    concurrency:
      group: |
        ${{ github.workflow }}
        ${{ github.event_name }}
        ${{ github.event.pull_request.number || format('{0}@{1}', github.ref, github.sha) }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The runner has both podman and docker; docker runs rootful here,
      # so the container writes the output as the runner's user.
      - name: Render the documentation
        run: make -C Documentation html CONTAINER=docker

      - name: Check the documentation against the code
        run: .github/scripts/check-docs.sh

      - name: Upload the rendered documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-html-docs
          path: Documentation/output/html/

      # main alone is published, and only once the check above passed.
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Documentation/output/html/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment cancelled midway publishes nothing, so a push to main
    # waits for the one in flight and only the newest waiting one runs.
    concurrency:
      group: ${{ github.workflow }}-pages
      cancel-in-progress: false

    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Renders on main can finish out of order: only main's head deploys.
      - name: Check that main has not moved on
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: .github/scripts/is-main-head.sh

      - name: Deploy to GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
