name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request supersedes this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The runner has both podman and docker; docker runs rootful here,
      # so the container writes the output as the runner's user.
      - name: Render the documentation
        run: make -C Documentation html CONTAINER=docker

      - name: Check the documentation against the code
        run: .github/scripts/check-docs.sh

      - name: Upload the rendered documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-html-docs
          path: Documentation/output/html/
