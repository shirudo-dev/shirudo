name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request supersedes this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  btf:
    name: bpf-next BTF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The BTF of the bpf-next kernel the build generates vmlinux.h from,
      # as the Build workflow takes it.
      - name: Copy the kernel BTF out of the LVH VM
        uses: cilium/little-vm-helper@c8b0bfbae3bdda7bc69fb9cd370e4b74ce84986d # v0.0.33
        with:
          test-name: shirudo-codeql-btf
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ github.workspace }}/../lvh
          install-dependencies: true
          cpu: 2
          mem: 4G
          cmd: |
            grep -aq 'signature_size' /sys/kernel/btf/vmlinux || {
              echo 'kernel BTF lacks bpf_attr.signature_size; needs a signed-BPF capable bpf-next kernel' >&2
              exit 1
            }
            mkdir -p /host/build
            cp /sys/kernel/btf/vmlinux /host/build/vmlinux.btf

      - name: Upload the kernel BTF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bpf-next-btf
          path: build/vmlinux.btf
          if-no-files-found: error
          retention-days: 1

  # CodeQL follows the compiler through a real build, which tells it the
  # types, macros and code each file is built with. Debian testing has the
  # OpenSSL 3.5 the build needs; the vendored libbpf and vmlinux.h are
  # built before the tracing starts, so that their code is not analyzed.
  c:
    name: Analyze (C)
    needs: btf
    runs-on: ubuntu-latest
    container: debian:testing
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # Without git the checkout is no repository, and the build takes its
      # version from one.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the kernel BTF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-next-btf
          path: build

      - name: Build what CodeQL does not analyze
        run: sh .github/scripts/codeql-c.sh prepare build/vmlinux.btf

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: +security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build the C sources under CodeQL
        run: sh .github/scripts/codeql-c.sh build build/vmlinux.btf

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp

  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            name: Python
          - language: java-kotlin
            name: Java
          - language: javascript-typescript
            name: TypeScript
          - language: actions
            name: Actions

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python, Java, TypeScript and the workflows are read without a build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: +security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
