name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The full build needs the BTF of a bpf-next kernel for vmlinux.h and
      # an OpenSSL 3.5 toolchain, neither of which the runner has, so the
      # sources are extracted without a build. The vendored libbpf is left
      # to its own project's scans.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: c-cpp
          build-mode: none
          queries: +security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:c-cpp
