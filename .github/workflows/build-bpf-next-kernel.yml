name: Build bpf-next kernel artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          sudo apt-get clean

      - name: Install GCC 15
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
          gcc-15 --version
          g++-15 --version

      - name: Build bpf-next kernel artifacts
        env:
          CC: gcc-15
          HOSTCC: gcc-15
          HOSTCXX: g++-15
        run: make -C testing bpf-next

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpf-next-kernel-debs-amd64
          retention-days: 14
          path: |
            artifacts/bpf-next-kernel-debs.tar.gz
            artifacts/bpf-next-kernel-debs.tar.gz.sha256sum
            artifacts/bpf-next-kernel-debs/bzImage
            artifacts/bpf-next-kernel-debs/bzImage.sha256sum
            artifacts/bpf-next-kernel-debs/vmlinux.btf
            artifacts/bpf-next-kernel-debs/vmlinux.btf.sha256sum
            artifacts/bpf-next-kernel-debs/bpf-next-kernel-build

  build-amazon-linux-rpm:
    runs-on: ubuntu-latest-4cores-16gb
    container: amazonlinux:2023
    timeout-minutes: 120

    steps:
      - name: Install checkout dependencies
        run: dnf install -y cpio git gzip kmod make tar

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Amazon Linux kernel RPM artifacts
        run: make -C testing bpf-next PACKAGE_FORMAT=rpm

      - name: Upload Amazon Linux kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpf-next-kernel-rpms-x86_64
          retention-days: 14
          path: |
            artifacts/bpf-next-kernel-rpms.tar.gz
            artifacts/bpf-next-kernel-rpms.tar.gz.sha256sum
            artifacts/bpf-next-kernel-rpms/*.rpm
            artifacts/bpf-next-kernel-rpms/bzImage
            artifacts/bpf-next-kernel-rpms/bzImage.sha256sum
            artifacts/bpf-next-kernel-rpms/vmlinux.btf
            artifacts/bpf-next-kernel-rpms/vmlinux.btf.sha256sum
            artifacts/bpf-next-kernel-rpms/bpf-next-kernel-build
