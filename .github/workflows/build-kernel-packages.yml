name: Build kernel packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: CI ${{ matrix.arch }} kernel packages
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, arm64]

    steps:
      - name: Check out kernel inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build CI kernel packages
        env:
          KERNEL_ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/build-test-kernel.sh "$KERNEL_ARCH"

      - name: Upload packages and build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-packages-${{ matrix.arch }}-ci
          path: build/test-kernel/pkgs/${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload corresponding kernel source
        if: github.event_name == 'workflow_dispatch' && matrix.arch == 'x86-64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-ci-source
          path: build/test-kernel/kernel-ci-source.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
