name: Build packages

on:
  push:
    branches:
      - main
    tags:
      - '*'
      - '!test-kernel-*'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      additional_config_cert:
        description: Base64-encoded DER X.509 config verification certificate; public data only
        required: false
        type: string

permissions:
  contents: read

# A newer push to a pull request supersedes its run. Any other run is
# keyed on its ref and commit, so a merge never cancels another's run.
concurrency:
  group: |
    ${{ github.workflow }}
    ${{ github.event_name }}
    ${{ github.event.pull_request.number || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine build version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version=$(git describe --tags --always --dirty --exclude 'test-kernel-*')
          fi
          mkdir -p build
          printf '%s\n' "$version" > build/ci-version

      - name: Restore the LVH static target dependencies
        id: lvh-target-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/lvh-target-deps
          key: lvh-target-deps-kind-bpf-next-20260603.072225-${{ hashFiles('.github/scripts/lvh-target-deps.sh') }}

      - name: Build installer tarballs and deb package in LVH VM
        uses: ./.github/actions/lvh
        with:
          test-name: shirudo-apt
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ runner.temp }}/lvh
          install-dependencies: true
          cmd: |
            systemctl start host.mount
            cd /host
            sh .github/scripts/lvh-prepare.sh

            cd /host

            # Read the workflow version through /host so it also reaches the VM.
            # LVH expands cmd in a host-side heredoc; escape guest-side dollars.
            export SHIRUDO_CI_VERSION="\$(cat build/ci-version)"
            test -n "\$SHIRUDO_CI_VERSION"
            deb_version=\$(printf '%s' "\$SHIRUDO_CI_VERSION" | \
              sed 's/^v//; s/[^A-Za-z0-9.+:~-]/./g; /^[0-9][0-9]*\./!s/^/0~/')
            test -n "\$deb_version"
            # Each package target starts with make clean, so preserve these
            # outputs before bindeb-pkg removes them.
            mkdir -p /tmp/shirudo-packages
            make -C packaging bintar-pkg \
              SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION' \
              TARGET_DEPS_PREBUILT=1 \
              SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
              SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib
            cp shirudo.tar.gz shirudo-static.tar.gz /tmp/shirudo-packages/
            cp vendor/linux/vmlinux.h /tmp/shirudo-packages/

            # Both installers relocate under DESTDIR and carry static PIE.
            for tarball in shirudo.tar.gz shirudo-static.tar.gz; do
              rm -rf /tmp/bintar && mkdir -p /tmp/bintar/archive /tmp/bintar/root
              tar -C /tmp/bintar/archive -xzf "\$tarball" --strip-components=1
              DESTDIR=/tmp/bintar/root /tmp/bintar/archive/install.sh
              test -x /tmp/bintar/root/usr/local/bin/shirudo
              sh .github/scripts/check-static-target.sh /tmp/bintar/root/usr/local/bin/shirudo
              test -f /tmp/bintar/root/usr/lib/systemd/system/shirudo.service
              /tmp/bintar/root/usr/local/bin/shirudo version
            done

            make -C packaging bindeb-pkg \
              DEB_RAW_VERSION="\$SHIRUDO_CI_VERSION" \
              DEB_VERSION="\$deb_version" \
              SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION' \
              TARGET_DEPS_PREBUILT=1 \
              SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
              SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib
            cp shirudo-*.deb /tmp/shirudo-packages/

            sh .github/scripts/check-static-target.sh shirudo-target

            cp /tmp/shirudo-packages/* .

            # An SPDX SBOM beside every package, from the dependency builds
            # the binaries linked.
            SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
            SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib \
              .github/scripts/gen-sbom.sh shirudo-*.deb

            apt-get update
            apt-get install -y /host/shirudo-operator_*.deb

            sh .github/scripts/check-operator-linkage.sh /usr/bin/shirudo \
              /usr/libexec/shirudo/shirudo-build
            sh .github/scripts/check-static-target.sh \
              /usr/bin/shirudo-quote-check

            /usr/bin/shirudo genkey

            # The default runtime image size must hold the static target.
            SHIRUDO=/usr/bin/shirudo \
              SHIRUDO_BUILD=/usr/libexec/shirudo/shirudo-build \
              SHIRUDO_GEN_RUNTIME=/usr/libexec/shirudo/gen-image/shirudo-gen-runtime \
              sh .github/scripts/check-runtime-image.sh shirudo-target

            # Verify that shirudo build works without a local copy of vmlinux.h
            rm -rf /tmp/shirudo-smoke && mkdir -p /tmp/shirudo-smoke
            cp testing/fixtures/basic.bpf.c /tmp/shirudo-smoke/
            pushd /tmp/shirudo-smoke
            # TODO: shirudo build should include multiarch include path.
            shirudo build basic.bpf.c --extra-cflags "-I/usr/include/\$(gcc -dumpmachine)"
            popd

            apt-get remove -y shirudo-operator

      - name: Save the LVH static target dependencies
        if: always() && steps.lvh-target-deps.outputs.cache-hit != 'true' && hashFiles('build/lvh-target-deps/lib/libcrypto.a') != '' && hashFiles('build/lvh-target-deps/curl/lib/libcurl.a') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/lvh-target-deps
          key: ${{ steps.lvh-target-deps.outputs.cache-primary-key }}

      - name: Upload deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-deb
          path: |
            shirudo-*.deb
            shirudo-*.deb.spdx.json
          if-no-files-found: error

      - name: Upload installer tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-tar
          path: |
            shirudo.tar.gz
            shirudo-static.tar.gz
            shirudo.tar.gz.spdx.json
            shirudo-static.tar.gz.spdx.json
          if-no-files-found: error

  publish-deb:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      packages: write
    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shirudo-deb
          path: ${{ runner.temp }}/shirudo-packages

      - name: Prepare OCI image containing Debian packages
        env:
          PACKAGE_DIR: ${{ runner.temp }}/shirudo-packages
        run: |
          set -euo pipefail
          image_root="${RUNNER_TEMP}/shirudo-deb-image"
          install -d "${image_root}"
          cp "${PACKAGE_DIR}"/*.deb "${image_root}/"
          cp "${PACKAGE_DIR}"/*.spdx.json "${image_root}/"
          printf 'FROM scratch\nCOPY . /\n' > "${image_root}/Dockerfile"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Debian packages to GitHub Container Registry
        run: |
          set -euo pipefail
          image=ghcr.io/shirudo-dev/shirudo-deb
          docker build \
            --label org.opencontainers.image.source=https://github.com/shirudo-dev/shirudo \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:main" \
            "${RUNNER_TEMP}/shirudo-deb-image"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:main"

  image-assets:
    needs: deb
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            clang \
            coreutils \
            cryptsetup-bin \
            dpkg-dev \
            e2fsprogs \
            file \
            libcap2-bin \
            libcurl4 \
            libssl3t64 \
            libtss2-tctildr0 \
            openssl \
            python3 \
            xz-utils

      - name: Install clang 23
        run: sudo sh .github/scripts/install-clang.sh

      - name: Download Debian packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shirudo-deb
          path: ${{ runner.temp }}/shirudo-packages

      - name: Build image assets with a temporary signer
        env:
          SHIRUDO_DIR: ${{ github.workspace }}
          SHIRUDO_PACKAGE_DIR: ${{ runner.temp }}/shirudo-packages
          OUTPUT_DIR: ${{ runner.temp }}/shirudo-image-assets
          SHIRUDO_ADDITIONAL_CONFIG_CERT_B64: ${{ github.event.inputs.additional_config_cert }}
        run: .github/scripts/build-image-assets.sh

      - name: Upload image assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-image-assets-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shirudo-image-assets/shirudo-image-assets.tar.gz
            ${{ runner.temp }}/shirudo-image-assets/shirudo-image-assets.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  rpm-target:
    outputs:
      version: ${{ steps.build-version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine build version
        id: build-version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version=$(git describe --tags --always --dirty --exclude 'test-kernel-*')
          fi
          mkdir -p build
          printf '%s\n' "$version" > build/ci-version
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore the LVH static target dependencies
        id: lvh-target-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/lvh-target-deps
          key: lvh-target-deps-kind-bpf-next-20260603.072225-${{ hashFiles('.github/scripts/lvh-target-deps.sh') }}

      - name: Build the target RPM and BPF header in LVH
        uses: ./.github/actions/lvh
        with:
          test-name: shirudo-rpm-target
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ runner.temp }}/lvh
          install-dependencies: true
          cmd: |
            set -eu
            systemctl start host.mount
            cd /host
            sh .github/scripts/lvh-prepare.sh

            export SHIRUDO_CI_VERSION="\$(cat build/ci-version)"
            test -n "\$SHIRUDO_CI_VERSION"

            make -C packaging binrpm-pkg PKG_ROLES=target \
              PKG_RAW_VERSION="\$SHIRUDO_CI_VERSION" \
              SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION' \
              TARGET_DEPS_PREBUILT=1 \
              SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
              SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib

            cp vendor/linux/vmlinux.h .
            rpm -qpi shirudo-target-*.rpm
            rpm -qp --scripts shirudo-target-*.rpm | grep -q 'systemctl enable shirudo.service'
            SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
            SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib \
              .github/scripts/gen-sbom.sh shirudo-target-*.rpm

      - name: Save the LVH static target dependencies
        if: always() && steps.lvh-target-deps.outputs.cache-hit != 'true' && hashFiles('build/lvh-target-deps/lib/libcrypto.a') != '' && hashFiles('build/lvh-target-deps/curl/lib/libcurl.a') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/lvh-target-deps
          key: ${{ steps.lvh-target-deps.outputs.cache-primary-key }}

      - name: Upload target RPM package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-rpm-target
          path: |
            shirudo-target-*.rpm
            shirudo-target-*.rpm.spdx.json
          if-no-files-found: error

      - name: Upload the bpf-next vmlinux.h
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bpf-next-vmlinux-h
          path: vmlinux.h
          if-no-files-found: error

  kernel-obs-preview:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: [deb, rpm-target]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build preview package with a temporary signer
        uses: ./.github/actions/kernel-obs
        with:
          mode: preview
          version: 0.1.${{ github.run_number }}-${{ github.event_name == 'pull_request' && format('pr.{0}', github.event.pull_request.number) || 'merge-group' }}
          artifact-name: ${{ github.event_name == 'pull_request' && format('kernel-obs-preview-pr-{0}', github.event.pull_request.number) || format('kernel-obs-preview-merge-group-{0}', github.event.merge_group.head_sha) }}

  kernel-obs-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deb, rpm-target]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # bpm push rewrites the signed index, so publishes run one at a time.
    # GitHub drops all but the newest waiting one, the greatest version.
    concurrency:
      group: ${{ github.workflow }}-kernel-obs-publish
      cancel-in-progress: false
    environment:
      name: kernel-obs
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and publish BPM package
        uses: ./.github/actions/kernel-obs
        with:
          mode: publish
          version: 0.1.${{ github.run_number }}
          artifact-name: kernel-obs-bpm
          signing-key-pem: ${{ secrets.KERNEL_OBS_SIGNING_KEY_PEM }}
          cert-der-b64: ${{ secrets.KERNEL_OBS_CERT_DER_B64 }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  rpm-operator:
    needs: rpm-target
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: fedora:45
      options: --ulimit memlock=-1:-1

    steps:
      # Fedora ships no static libcrypto, so make builds a static OpenSSL
      # for shirudo-quote-check, with perl, and links it with glibc-static.
      - name: Install the build dependencies
        run: |
          dnf -q install -y gcc make pkgconf-pkg-config git python3 rpm-build \
            cryptsetup openssl openssl-devel libcurl-devel tpm2-tss-devel \
            elfutils-libelf-devel zlib-ng-compat-devel luajit-devel jq \
            glibc-static perl

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore the quote checker's static OpenSSL
        id: quote-check-openssl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/quote-check-openssl
          key: quote-check-openssl-fedora45-${{ runner.arch }}-${{ hashFiles('Makefile.target-deps') }}

      - name: Install clang 23
        run: sh .github/scripts/install-clang.sh

      - name: Download the target rpm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shirudo-rpm-target
          path: target-rpm

      - name: Download the bpf-next vmlinux.h
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-next-vmlinux-h
          path: bpf-next

      - name: Build the operator rpm natively
        env:
          SHIRUDO_CI_VERSION: ${{ needs.rpm-target.outputs.version }}
        run: |
          git config --global --add safe.directory "$PWD"
          make -C packaging binrpm-pkg PKG_ROLES=operator \
            BPF_VMLINUX_H="$PWD/bpf-next/vmlinux.h" \
            PKG_RAW_VERSION="$SHIRUDO_CI_VERSION" \
            SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION'
          cmp bpf-next/vmlinux.h build/rpm/operator/usr/share/shirudo/vmlinux.h
          rpm -qpi shirudo-operator-*.rpm
          rpm -qp --requires shirudo-operator-*.rpm | grep -qx 'clang >= 23'
          .github/scripts/gen-sbom.sh shirudo-operator-*.rpm

      - name: Save the quote checker's static OpenSSL
        if: always() && steps.quote-check-openssl.outputs.cache-hit != 'true' && hashFiles('build/quote-check-openssl/lib/libcrypto.a') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/quote-check-openssl
          key: ${{ steps.quote-check-openssl.outputs.cache-primary-key }}

      - name: Install, exercise and remove both packages
        run: |
          set -eux
          dnf -q install -y ./target-rpm/shirudo-target-*.rpm
          rpm -q shirudo-target
          rpm -qV shirudo-target
          rpm -q --scripts shirudo-target | grep -q 'systemctl enable shirudo.service'
          test -f /usr/lib/systemd/system/shirudo.service
          test -f /usr/lib/systemd/system/shirudo-bpm-tree-sync.timer
          shirudo version
          if dnf -q install -y ./shirudo-operator-*.rpm; then
            echo 'shirudo-operator must conflict with shirudo-target' >&2
            exit 1
          fi
          dnf -q remove -y shirudo-target
          dnf -q install -y ./shirudo-operator-*.rpm
          rpm -q shirudo-operator clang
          rpm -qV shirudo-operator
          sh .github/scripts/check-operator-linkage.sh /usr/bin/shirudo \
            /usr/libexec/shirudo/shirudo-build
          sh .github/scripts/check-static-target.sh \
            /usr/bin/shirudo-quote-check
          shirudo genkey
          rm -rf /tmp/shirudo-smoke && mkdir -p /tmp/shirudo-smoke
          cp testing/fixtures/basic.bpf.c /tmp/shirudo-smoke/
          cd /tmp/shirudo-smoke
          shirudo build basic.bpf.c
          shirudo upatch info basic.bpf.upatch
          dnf -q remove -y shirudo-operator
          hash -r
          ! command -v shirudo

      - name: Upload operator rpm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-rpm-operator
          path: |
            shirudo-operator-*.rpm
            shirudo-operator-*.rpm.spdx.json
          if-no-files-found: error

  publish-rpm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rpm-target, rpm-operator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      packages: write
    steps:
      - name: Download target RPM packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shirudo-rpm-target
          path: ${{ runner.temp }}/shirudo-rpms

      - name: Download operator RPM packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shirudo-rpm-operator
          path: ${{ runner.temp }}/shirudo-rpms

      - name: Prepare OCI image containing RPM packages
        env:
          PACKAGE_DIR: ${{ runner.temp }}/shirudo-rpms
        run: |
          set -euo pipefail
          image_root="${RUNNER_TEMP}/shirudo-rpm-image"
          install -d "${image_root}"
          cp "${PACKAGE_DIR}"/*.rpm "${image_root}/"
          cp "${PACKAGE_DIR}"/*.spdx.json "${image_root}/"
          printf 'FROM scratch\nCOPY . /\n' > "${image_root}/Dockerfile"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish RPM packages to GitHub Container Registry
        run: |
          set -euo pipefail
          image=ghcr.io/shirudo-dev/shirudo-rpm
          docker build \
            --label org.opencontainers.image.source=https://github.com/shirudo-dev/shirudo \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:main" \
            "${RUNNER_TEMP}/shirudo-rpm-image"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:main"

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [deb, rpm-operator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download deb, rpm and tarball packages and their SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shirudo-*
          merge-multiple: true

      - name: Upload packages and SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" shirudo-*.deb shirudo-*.rpm shirudo*.tar.gz \
              shirudo*.spdx.json --clobber
          else
            gh release create "$RELEASE_TAG" shirudo-*.deb shirudo-*.rpm shirudo*.tar.gz \
              shirudo*.spdx.json \
              --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
