name: CI suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Optional run ID; defaults to the latest successful kernel main run
        required: false
        type: string

permissions:
  contents: read
  actions: read

# A newer run for the same branch or pull request supersedes this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CI tests
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve kernel package artifact
        id: kernel-run
        env:
          GH_TOKEN: ${{ secrets.KERNEL_REPO_READ_TOKEN }}
          REQUESTED_RUN_ID: ${{ inputs.kernel_run_id }}
        run: |
          if [ -n "$REQUESTED_RUN_ID" ]; then
            case "$REQUESTED_RUN_ID" in
              *[!0-9]*) echo "kernel_run_id must be numeric" >&2; exit 1 ;;
            esac
            run_id="$REQUESTED_RUN_ID"
          else
            run_id=$(gh api \
              'repos/shirudo-dev/kernel/actions/artifacts?name=kernel-packages-x86-64-ci&per_page=100' \
              --jq '
                [.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")]
                | sort_by(.created_at)
                | last
                | .workflow_run.id
              ')
            if [ -z "$run_id" ] || [ "$run_id" = null ]; then
              echo "no kernel CI package artifact found on main" >&2
              exit 1
            fi
          fi
          echo "Using kernel package run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download kernel CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-packages-x86-64-ci
          repository: shirudo-dev/kernel
          run-id: ${{ steps.kernel-run.outputs.run_id }}
          github-token: ${{ secrets.KERNEL_REPO_READ_TOKEN }}
          path: build/kernel-ci-artifact

      - name: Restore the static target dependencies
        id: target-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/target-deps
          key: target-deps-${{ hashFiles('Makefile.target-deps') }}

      - name: Restore the VM images
        id: images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-vm/cache
          key: test-vm-images-${{ hashFiles('testing/vm/runtime-packages', 'testing/vm/prepare-runtime.sh', 'testing/vm/build-bundle.sh', 'testing/vm/arch.sh') }}

      - name: Prepare the runner as the VM host
        id: setup
        env:
          KERNEL_CI_ARTIFACT_DIR: ${{ format('{0}/build/kernel-ci-artifact', github.workspace) }}
        run: .github/scripts/tests.sh setup

      - name: Run unit tests
        id: unit
        run: .github/scripts/tests.sh run unit

      - name: Upload unit guest logs
        if: always() && steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-unit
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      - name: Run functional tests
        id: functional
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .github/scripts/tests.sh run functional

      - name: Upload functional guest logs
        if: always() && steps.functional.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-functional
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      - name: Run end-to-end tests
        id: end2end
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .github/scripts/tests.sh run end2end

      - name: Upload end-to-end guest logs
        if: always() && steps.end2end.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-end2end
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      # Save each expensive build once it is complete, even when a later
      # step fails, so the next run does not rebuild it.
      - name: Save the static target dependencies
        if: always() && steps.target-deps.outputs.cache-hit != 'true' && hashFiles('build/target-deps/lib/libcrypto.a') != '' && hashFiles('build/target-deps/curl/lib/libcurl.a') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/target-deps
          key: ${{ steps.target-deps.outputs.cache-primary-key }}

      # hashFiles reads every byte it matches and gives up after two
      # minutes, too short for an image; the key file beside one is
      # written once the image is complete.
      - name: Save the VM images
        if: always() && steps.images.outputs.cache-hit != 'true' && hashFiles('build/test-vm/cache/runtime/.*.key') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-vm/cache
          key: ${{ steps.images.outputs.cache-primary-key }}
