name: CI suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch or pull request supersedes this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CI tests
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bpf-next moves daily; a week-old kernel still tests the tree, and
      # building one takes most of the run.
      - name: Name the kernel cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the bpf-next kernel
        id: kernel
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: artifacts/bpf-next-kernel-debs
          key: test-vm-kernel-${{ steps.week.outputs.week }}-${{ hashFiles('testing/vm/build-kernel.sh', 'testing/vm/arch.sh', 'testing/Makefile', 'kernel/*.patch') }}

      - name: Restore the static target dependencies
        id: target-deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/target-deps
          key: target-deps-${{ hashFiles('Makefile.target-deps') }}

      - name: Restore the VM images
        id: images
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/test-vm/cache
          key: test-vm-images-${{ hashFiles('testing/vm/runtime-packages', 'testing/vm/prepare-runtime.sh', 'testing/vm/build-bundle.sh', 'testing/vm/arch.sh') }}

      - name: Prepare the runner as the VM host
        run: .github/scripts/tests.sh setup

      - name: Run unit tests
        id: unit
        run: .github/scripts/tests.sh run unit

      - name: Upload unit guest logs
        if: always() && steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-unit
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      - name: Run functional tests
        id: functional
        if: ${{ !cancelled() }}
        run: .github/scripts/tests.sh run functional

      - name: Upload functional guest logs
        if: always() && steps.functional.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-functional
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      - name: Run end-to-end tests
        id: end2end
        if: ${{ !cancelled() }}
        run: .github/scripts/tests.sh run end2end

      - name: Upload end-to-end guest logs
        if: always() && steps.end2end.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-end2end
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      # Each part is saved once it is complete, even when a later step
      # fails, so that the next run does not build it again.
      - name: Save the bpf-next kernel
        if: always() && steps.kernel.outputs.cache-hit != 'true' && hashFiles('artifacts/bpf-next-kernel-debs/bzImage.sha256sum') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/bpf-next-kernel-debs
          key: ${{ steps.kernel.outputs.cache-primary-key }}

      - name: Save the static target dependencies
        if: always() && steps.target-deps.outputs.cache-hit != 'true' && hashFiles('build/target-deps/lib/libcrypto.a') != '' && hashFiles('build/target-deps/curl/lib/libcurl.a') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/target-deps
          key: ${{ steps.target-deps.outputs.cache-primary-key }}

      # hashFiles reads every byte it matches and gives up after two
      # minutes, too short for an image; the key file beside one is
      # written once the image is complete.
      - name: Save the VM images
        if: always() && steps.images.outputs.cache-hit != 'true' && hashFiles('build/test-vm/cache/runtime/.*.key') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-vm/cache
          key: ${{ steps.images.outputs.cache-primary-key }}
