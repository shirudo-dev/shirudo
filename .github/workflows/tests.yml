name: CI suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Optional override; defaults to the run testing/vm/kernel-artifact.sh pins
        required: false
        type: string

permissions:
  contents: read
  actions: read

# A newer run for the same branch or pull request supersedes this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kernel-plan:
    name: Select the test kernel
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the kernel inputs changed
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
        run: sh .github/scripts/select-test-kernel.sh

  kernel-build:
    needs: kernel-plan
    if: needs.kernel-plan.outputs.build == 'true'
    uses: ./.github/workflows/build-kernel-packages.yml

  tests:
    needs: [kernel-plan, kernel-build]
    if: ${{ !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CI tests
            runner: ubuntu-latest
            vm: '1'
            coverage: '1'
          - name: CI host tests (arm64)
            runner: ubuntu-24.04-arm
            vm: '0'
            coverage: '0'
    env:
      VM: ${{ matrix.vm }}
      COVERAGE: ${{ matrix.coverage }}

    steps:
      - name: Require successful kernel preparation
        if: >-
          needs.kernel-plan.result != 'success' ||
          (needs.kernel-plan.outputs.build == 'true' && needs.kernel-build.result != 'success')
        run: /usr/bin/false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the kernel built for this run
        if: needs.kernel-plan.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-packages-x86-64-ci
          path: build/kernel-ci-artifact

      - name: Download the pinned or selected kernel
        if: needs.kernel-plan.outputs.build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
          TEST_VM_ARCH: x86_64
        run: testing/vm/kernel-artifact.sh download

      - name: Restore the static target dependencies
        if: matrix.vm == '1'
        id: target-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/target-deps
          key: target-deps-${{ hashFiles('Makefile.target-deps') }}

      - name: Restore the host OpenSSL toolchain
        id: host-openssl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-openssl
          key: host-openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/vm-toolchain.sh') }}

      - name: Restore the host libtpms toolchain
        id: host-libtpms
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-libtpms
          key: host-libtpms-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/vm-toolchain.sh', '.github/scripts/install-libtpms.sh') }}

      - name: Restore the VM images
        if: matrix.vm == '1'
        id: images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-vm/cache
          key: test-vm-images-${{ hashFiles('testing/vm/runtime-packages', 'testing/vm/operator-packages', 'testing/vm/prepare-runtime.sh', 'testing/vm/build-bundle.sh', 'testing/vm/arch.sh', '.github/scripts/install-clang.sh', '.github/scripts/install-static-libcrypto-deps.sh', 'testing/container/Containerfile', 'testing/container/packages', 'Makefile.target-deps') }}

      - name: Prepare the test environment
        id: setup
        env:
          KERNEL_CI_ARTIFACT_DIR: ${{ format('{0}/build/kernel-ci-artifact', github.workspace) }}
        run: .github/scripts/tests.sh setup

      - name: Run unit tests
        id: unit
        run: .github/scripts/tests.sh run unit

      - name: Upload unit guest logs
        if: always() && steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-unit
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      - name: Run functional tests
        id: functional
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .github/scripts/tests.sh run functional

      - name: Upload functional guest logs
        if: always() && steps.functional.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-functional
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      - name: Run end-to-end tests
        id: end2end
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.vm == '1' }}
        run: .github/scripts/tests.sh run end2end

      - name: Collect host userspace coverage
        if: env.COVERAGE == '1'
        run: .github/scripts/coverage.sh

      - name: Upload coverage to Coveralls
        if: env.COVERAGE == '1'
        uses: coverallsapp/github-action@cfd0633edbd2411b532b808ba7a8b5e04f76d2c8 # v2.3.4
        with:
          file: coverage/host.lcov
          format: lcov

      - name: Upload end-to-end guest logs
        if: always() && steps.end2end.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-logs-end2end
          path: |
            build/test-vm/vms/*/result
            build/test-vm/vms/*/console.log
          if-no-files-found: ignore

      # Save each expensive build once it is complete, even when a later
      # step fails, so the next run does not rebuild it.
      - name: Save the static target dependencies
        if: always() && matrix.vm == '1' && steps.target-deps.outputs.cache-hit != 'true' && hashFiles('build/target-deps/lib/libcrypto.a') != '' && hashFiles('build/target-deps/curl/lib/libcurl.a') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/target-deps
          key: ${{ steps.target-deps.outputs.cache-primary-key }}

      - name: Save the host OpenSSL toolchain
        if: always() && steps.host-openssl.outputs.cache-hit != 'true' && hashFiles('build/host-openssl/.shirudo-openssl-built') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-openssl
          key: ${{ steps.host-openssl.outputs.cache-primary-key }}

      - name: Save the host libtpms toolchain
        if: always() && steps.host-libtpms.outputs.cache-hit != 'true' && hashFiles('build/host-libtpms/lib/libtpms.so') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-libtpms
          key: ${{ steps.host-libtpms.outputs.cache-primary-key }}

      # hashFiles reads every byte it matches and gives up after two
      # minutes, too short for an image; the key file beside one is
      # written once the image is complete.
      - name: Save the VM images
        if: always() && matrix.vm == '1' && steps.images.outputs.cache-hit != 'true' && hashFiles('build/test-vm/cache/runtime/.*.key') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-vm/cache
          key: ${{ steps.images.outputs.cache-primary-key }}

  backend:
    name: Backend SQL tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the SQL tests in a ClickHouse container
        run: make -C tools/backend tests

  xtop:
    name: xtop tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Type-check and run the unit tests
        run: make -C tools/xtop tests

      - name: Build the executable
        run: make -C tools/xtop
