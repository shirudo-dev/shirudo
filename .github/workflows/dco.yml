name: DCO

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every commit a pull request adds, or a push brings to main, needs
      # a subject, a body and its author's sign-off; ci-commit-range.sh
      # picks the commits the event covers.
      - name: Check the sign-off of every commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: .github/scripts/ci-commit-range.sh .github/scripts/check-dco.sh
