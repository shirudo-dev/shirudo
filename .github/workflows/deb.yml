name: Build packages

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine build version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version=$(git describe --tags --always --dirty)
          fi
          mkdir -p build
          printf '%s\n' "$version" > build/ci-version

      - name: Restore the LVH static target dependencies
        id: lvh-target-deps
        uses: actions/cache/restore@v4
        with:
          path: build/lvh-target-deps
          key: lvh-target-deps-kind-bpf-next-20260603.072225-${{ hashFiles('.github/scripts/lvh-target-deps.sh') }}

      - name: Build the tarball, deb and target rpm packages and run shirudo in LVH VM
        uses: cilium/little-vm-helper@f86d344aca812dda5aef167867a9a0a90ca6cca5 # v0.0.31
        with:
          test-name: shirudo-apt
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ github.workspace }}/../lvh
          install-dependencies: true
          cpu: 4
          mem: 8G
          cmd: |
            grep -qw bpf /sys/kernel/security/lsm
            grep -aq 'signature_size' /sys/kernel/btf/vmlinux || {
              echo 'kernel BTF lacks bpf_attr.signature_size; needs a signed-BPF capable bpf-next kernel' >&2
              exit 1
            }
            cd /host

            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential \
              ca-certificates \
              clang \
              cryptsetup-bin \
              e2fsprogs \
              llvm \
              python3 \
              pkg-config \
              autoconf \
              autoconf-archive \
              automake \
              doxygen \
              libacl1-dev \
              libftdi1-dev \
              libini-config-dev \
              libssl-dev \
              libfido2-dev \
              libtss2-dev \
              libelf-dev \
              zlib1g-dev \
              libzstd-dev \
              libcurl4-openssl-dev \
              libjson-c-dev \
              libtool \
              libtool-bin \
              libltdl-dev \
              libusb-1.0-0-dev \
              libluajit-5.1-dev \
              uuid-dev \
              dpkg-dev \
              rpm \
              curl \
              binutils \
              file \
              jq \
              git

            git config --global --add safe.directory /host

            sh .github/scripts/lvh-target-deps.sh

            cd /host

            # Read the workflow version through /host so it also reaches the VM.
            # LVH expands cmd in a host-side heredoc; escape guest-side dollars.
            export SHIRUDO_CI_VERSION="\$(cat build/ci-version)"
            test -n "\$SHIRUDO_CI_VERSION"
            deb_version=\$(printf '%s' "\$SHIRUDO_CI_VERSION" | \
              sed 's/^v//; s/[^A-Za-z0-9.+:~-]/./g; /^[0-9]/!s/^/0~/')
            test -n "\$deb_version"
            # Every package target starts from make clean, which also removes
            # the other families' outputs, so stash each result as it is built.
            mkdir -p /tmp/shirudo-packages
            make -C packaging bintar-pkg \
              SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION' \
              TARGET_DEPS_PREBUILT=1 \
              SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
              SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib
            cp shirudo.tar.gz shirudo-static.tar.gz /tmp/shirudo-packages/
            # The operator package ships vmlinux.h for the target kernel; the
            # Fedora job below builds against this bpf-next one, not its host's.
            cp vendor/linux/vmlinux.h /tmp/shirudo-packages/vmlinux.h

            # Both installers relocate under DESTDIR and carry static PIE.
            for tarball in shirudo.tar.gz shirudo-static.tar.gz; do
              rm -rf /tmp/bintar && mkdir -p /tmp/bintar/archive /tmp/bintar/root
              tar -C /tmp/bintar/archive -xzf "\$tarball" --strip-components=1
              DESTDIR=/tmp/bintar/root /tmp/bintar/archive/install.sh
              test -x /tmp/bintar/root/usr/local/bin/shirudo
              sh .github/scripts/check-static-target.sh /tmp/bintar/root/usr/local/bin/shirudo
              test -f /tmp/bintar/root/usr/lib/systemd/system/shirudo.service
              /tmp/bintar/root/usr/local/bin/shirudo version
            done

            make -C packaging bindeb-pkg \
              DEB_RAW_VERSION="\$SHIRUDO_CI_VERSION" \
              DEB_VERSION="\$deb_version" \
              SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION' \
              TARGET_DEPS_PREBUILT=1 \
              SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
              SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib
            cp shirudo-*.deb /tmp/shirudo-packages/

            sh .github/scripts/check-static-target.sh shirudo-target

            # The target rpm is fully static and portable, so it is
            # built here; the operator rpm links the distribution's shared
            # libraries and is built natively in the Fedora job below.
            make -C packaging binrpm-pkg PKG_ROLES=target \
              PKG_RAW_VERSION="\$SHIRUDO_CI_VERSION" \
              SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION' \
              TARGET_DEPS_PREBUILT=1 \
              SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
              SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib
            rpm -qpi shirudo-target-*.rpm
            rpm -qp --scripts shirudo-target-*.rpm | grep -q 'systemctl enable shirudo.service'
            cp shirudo-target-*.rpm /tmp/shirudo-packages/
            cp /tmp/shirudo-packages/* .

            # An SPDX SBOM beside every package, from the dependency builds
            # the binaries linked.
            SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-curl/lib/pkgconfig:/tmp/shirudo-openssl/lib/pkgconfig \
            SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib \
              .github/scripts/gen-sbom.sh shirudo-*.deb shirudo-target-*.rpm \
              shirudo.tar.gz shirudo-static.tar.gz

            apt-get update
            apt-get install -y /host/shirudo-operator_*.deb

            /usr/bin/shirudo genkey

            # Verify that shirudo build works without a local copy of vmlinux.h
            rm -rf /tmp/shirudo-smoke && mkdir -p /tmp/shirudo-smoke
            cp testing/fixtures/basic.bpf.c /tmp/shirudo-smoke/
            pushd /tmp/shirudo-smoke
            # TODO: shirudo build should include multiarch include path.
            shirudo build basic.bpf.c --extra-cflags "-I/usr/include/\$(gcc -dumpmachine)"
            popd

            apt-get remove -y shirudo-operator

      - name: Save the LVH static target dependencies
        if: always() && steps.lvh-target-deps.outputs.cache-hit != 'true' && hashFiles('build/lvh-target-deps/lib/libcrypto.a') != '' && hashFiles('build/lvh-target-deps/curl/lib/libcurl.a') != ''
        uses: actions/cache/save@v4
        with:
          path: build/lvh-target-deps
          key: ${{ steps.lvh-target-deps.outputs.cache-primary-key }}

      - name: Name the target kernel cache week
        id: target-kernel-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Shirudo bpf-next kernel
        id: target-kernel
        uses: actions/cache/restore@v4
        with:
          path: artifacts/bpf-next-kernel-debs
          key: test-vm-kernel-${{ steps.target-kernel-week.outputs.week }}-${{ hashFiles('contrib/build-kernel-package.sh', 'contrib/test-vm-arch.sh', 'testing/Makefile', 'kernel/*.patch') }}

      - name: Restore the target VM image
        id: target-vm-image
        uses: actions/cache/restore@v4
        with:
          path: build/test-vm/cache
          key: test-vm-images-${{ hashFiles('contrib/test-vm-runtime-packages', 'contrib/prepare-test-vm-runtime.sh', 'contrib/build-test-vm-bundle.sh', 'contrib/test-vm-arch.sh') }}

      - name: Restore the target build dependencies
        id: target-deps
        uses: actions/cache/restore@v4
        with:
          path: build/target-deps
          key: target-deps-${{ hashFiles('Makefile.target-deps') }}

      - name: Prepare runner with the cached Shirudo bpf-next kernel
        run: .github/scripts/target-tests.sh setup

      - name: Run target tests in staging configuration
        run: .github/scripts/target-tests.sh staging

      # Keep reporting the production boot failure without blocking package builds.
      - name: Run target tests in production configuration
        continue-on-error: true
        run: .github/scripts/target-tests.sh production

      - name: Save the target build dependencies
        if: always() && steps.target-deps.outputs.cache-hit != 'true' && hashFiles('build/target-deps/lib/libcrypto.a') != '' && hashFiles('build/target-deps/curl/lib/libcurl.a') != ''
        uses: actions/cache/save@v4
        with:
          path: build/target-deps
          key: ${{ steps.target-deps.outputs.cache-primary-key }}

      - name: Save the target kernel
        if: always() && steps.target-kernel.outputs.cache-hit != 'true' && hashFiles('artifacts/bpf-next-kernel-debs/bzImage.sha256sum') != ''
        uses: actions/cache/save@v4
        with:
          path: artifacts/bpf-next-kernel-debs
          key: ${{ steps.target-kernel.outputs.cache-primary-key }}

      - name: Save the target VM image
        if: always() && steps.target-vm-image.outputs.cache-hit != 'true' && hashFiles('build/test-vm/cache/runtime/*.qcow2') != ''
        uses: actions/cache/save@v4
        with:
          path: build/test-vm/cache
          key: ${{ steps.target-vm-image.outputs.cache-primary-key }}

      - name: Upload deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-deb
          path: |
            shirudo-*.deb
            shirudo-*.deb.spdx.json
          if-no-files-found: error

      - name: Upload target rpm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-rpm-target
          path: |
            shirudo-target-*.rpm
            shirudo-target-*.rpm.spdx.json
          if-no-files-found: error

      - name: Upload installer tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-tar
          path: |
            shirudo.tar.gz
            shirudo-static.tar.gz
            shirudo.tar.gz.spdx.json
            shirudo-static.tar.gz.spdx.json
          if-no-files-found: error

      - name: Upload the bpf-next vmlinux.h
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bpf-next-vmlinux-h
          path: vmlinux.h
          if-no-files-found: error

  rpm-operator:
    needs: deb
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install the build dependencies
        run: |
          dnf -q install -y gcc make pkgconf-pkg-config git python3 rpm-build \
            clang llvm cryptsetup openssl openssl-devel libcurl-devel tpm2-tss-devel \
            elfutils-libelf-devel zlib-ng-compat-devel luajit-devel jq

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the target rpm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shirudo-rpm-target
          path: target-rpm

      - name: Download the bpf-next vmlinux.h
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-next-vmlinux-h
          path: bpf-next

      - name: Build the operator rpm natively
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$PWD"
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version=$(git describe --tags --always --dirty)
          fi
          export SHIRUDO_CI_VERSION="$version"
          make -C packaging binrpm-pkg PKG_ROLES=operator \
            BPF_VMLINUX_H="$PWD/bpf-next/vmlinux.h" \
            PKG_RAW_VERSION="$SHIRUDO_CI_VERSION" \
            SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION'
          cmp bpf-next/vmlinux.h build/rpm/operator/usr/share/shirudo/vmlinux.h
          rpm -qpi shirudo-operator-*.rpm
          rpm -qp --requires shirudo-operator-*.rpm | grep -qx clang
          .github/scripts/gen-sbom.sh shirudo-operator-*.rpm

      - name: Install, exercise and remove both packages
        run: |
          set -eux
          dnf -q install -y ./target-rpm/shirudo-target-*.rpm
          rpm -q shirudo-target
          rpm -qV shirudo-target
          rpm -q --scripts shirudo-target | grep -q 'systemctl enable shirudo.service'
          test -f /usr/lib/systemd/system/shirudo.service
          test -f /usr/lib/systemd/system/shirudo-bpm-tree-sync.timer
          shirudo version
          if dnf -q install -y ./shirudo-operator-*.rpm; then
            echo 'shirudo-operator must conflict with shirudo-target' >&2
            exit 1
          fi
          dnf -q remove -y shirudo-target
          dnf -q install -y ./shirudo-operator-*.rpm
          rpm -q shirudo-operator clang
          rpm -qV shirudo-operator
          shirudo genkey
          rm -rf /tmp/shirudo-smoke && mkdir -p /tmp/shirudo-smoke
          cp testing/fixtures/basic.bpf.c /tmp/shirudo-smoke/
          cd /tmp/shirudo-smoke
          shirudo build basic.bpf.c
          shirudo upatch info basic.bpf.upatch
          dnf -q remove -y shirudo-operator
          hash -r
          ! command -v shirudo

      - name: Upload operator rpm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shirudo-rpm-operator
          path: |
            shirudo-operator-*.rpm
            shirudo-operator-*.rpm.spdx.json
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [deb, rpm-operator]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download deb, rpm and tarball packages and their SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shirudo-*
          merge-multiple: true

      - name: Upload packages and SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" shirudo-*.deb shirudo-*.rpm shirudo*.tar.gz \
              shirudo*.spdx.json --clobber
          else
            gh release create "$RELEASE_TAG" shirudo-*.deb shirudo-*.rpm shirudo*.tar.gz \
              shirudo*.spdx.json \
              --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
