name: Build every commit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its run. Any other run is
# keyed on its ref and commit, so a merge never cancels another's run.
concurrency:
  group: |
    ${{ github.workflow }}
    ${{ github.event_name }}
    ${{ github.event.pull_request.number || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  build-commits:
    name: Build each commit on its own
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Documentation/contribute/code/contributing.rst asks for every commit to
      # build on its own, so that the history bisects; the other workflows
      # build the head of the pull request or of main alone. The BPF objects need the BTF
      # of a signed-BPF capable bpf-next kernel, so the builds run in the
      # same LVH VM as the package build. The guest does not inherit the
      # runner's environment; GITHUB_ACTIONS is set for the annotations.
      - name: Build every commit the pull request or push adds in LVH VM
        uses: ./.github/actions/lvh
        with:
          test-name: shirudo-build-commits
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ runner.temp }}/lvh
          install-dependencies: true
          cmd: |
            systemctl start host.mount
            cd /host
            .github/scripts/vm-toolchain.sh
            . build/vm-toolchain.env
            GITHUB_ACTIONS=true .github/scripts/build-commits.sh \
              ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
