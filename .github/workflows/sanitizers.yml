name: Sanitizers

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch or pull request supersedes this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ASan+UBSan (${{ matrix.compiler }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build does not depend on the compiler under test, so one cache
      # entry serves both matrix legs.
      - name: Restore the sanitizer OpenSSL build
        id: sanitizer-openssl
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/sanitizer-openssl
          key: sanitizer-openssl-${{ hashFiles('.github/scripts/sanitizer-openssl-deps.sh') }}

      # The BPF objects embedded in the binary need the BTF of a signed-BPF
      # capable bpf-next kernel, so the build runs in the same LVH VM as the
      # package build. The host-side suite itself needs no root, LSM or TPM.
      - name: Build with sanitizers and run the host-side suite in LVH VM
        uses: cilium/little-vm-helper@f86d344aca812dda5aef167867a9a0a90ca6cca5 # v0.0.31
        with:
          test-name: shirudo-sanitizers-${{ matrix.compiler }}
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ github.workspace }}/../lvh
          install-dependencies: true
          cpu: 4
          mem: 8G
          cmd: |
            grep -aq 'signature_size' /sys/kernel/btf/vmlinux || {
              echo 'kernel BTF lacks bpf_attr.signature_size; needs a signed-BPF capable bpf-next kernel' >&2
              exit 1
            }
            cd /host

            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential \
              ca-certificates \
              cryptsetup-bin \
              e2fsprogs \
              curl \
              git \
              pkg-config \
              python3 \
              libcurl4-openssl-dev \
              libelf-dev \
              libluajit-5.1-dev \
              libtpms-dev \
              libtss2-dev \
              zlib1g-dev
            sh .github/scripts/install-clang.sh libclang-rt-23-dev

            git config --global --add safe.directory /host

            sh .github/scripts/sanitizer-openssl-deps.sh

            export PATH=/tmp/shirudo-openssl/bin:\$PATH
            export PKG_CONFIG_PATH=/tmp/shirudo-openssl/lib/pkgconfig
            export LD_LIBRARY_PATH=/tmp/shirudo-openssl/lib
            export CC=${{ matrix.compiler }}

            make -j4 SANITIZE=address,undefined
            make SANITIZE=address,undefined shirudo-build
            make -C testing SANITIZE=address,undefined test-helpers
            make tests VM=0 SANITIZE=address,undefined

      - name: Save the sanitizer OpenSSL build
        if: always() && steps.sanitizer-openssl.outputs.cache-hit != 'true' && hashFiles('build/sanitizer-openssl/lib/libcrypto.so') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/sanitizer-openssl
          key: ${{ steps.sanitizer-openssl.outputs.cache-primary-key }}

  libfuzzer:
    name: libFuzzer
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every run starts from the corpus the last nightly run kept; the
      # newest one is restored, as each is saved under a key of its own.
      - name: Restore the fuzz corpora
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      # The targets need no BPF objects, but the toolchain the other jobs
      # build in comes with the LVH guest. A push or a pull request gets a
      # minute per target, the nightly run ten.
      - name: Fuzz the parsers of input from outside the host in LVH VM
        id: fuzz
        uses: cilium/little-vm-helper@f86d344aca812dda5aef167867a9a0a90ca6cca5 # v0.0.31
        with:
          test-name: shirudo-libfuzzer
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ github.workspace }}/../lvh
          install-dependencies: true
          cpu: 4
          mem: 8G
          cmd: |
            cd /host
            .github/scripts/vm-toolchain.sh libclang-rt-23-dev
            . build/vm-toolchain.env
            make -C testing fuzz \
              FUZZ_SECONDS=${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 600 || 60 }} \
              FUZZ_CORPUS=/host/build/fuzz-corpus

      # Only the nightly and manual runs save, so that each push does not
      # add a corpus to the cache the kernel and the VM images share.
      - name: Save the fuzz corpora
        if: always() && steps.fuzz.outcome != 'skipped' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: testing/fuzz/crash-*
          if-no-files-found: ignore
