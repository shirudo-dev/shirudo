name: Coverage

# An instrumented build is not the one that ships, and a coverage figure
# that moves with the runner is no gate for a pull request: the report
# is made from what lands on main, as
# Documentation/contribute/testing/testing.rst says.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Optional override; defaults to the run testing/vm/kernel-artifact.sh pins
        required: false
        type: string

permissions:
  contents: read
  actions: read

# A push while a report is made queues its run behind it rather than
# cancelling it: pushes closer together than a run takes would leave
# main without a finished one. GitHub keeps only the newest run waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, functional-ci-1, functional-ci-2, functional-ci-3, functional-ci-4, end2end]
    env:
      VM: ${{ matrix.suite == 'unit' && '0' || '1' }}
      COVERAGE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the pinned or selected kernel
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
          TEST_VM_ARCH: x86_64
        run: testing/vm/kernel-artifact.sh download

      # The caches are those of the CI suite, which saves them: this
      # workflow only reads them.
      - name: Restore the static target dependencies
        if: matrix.suite != 'unit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/target-deps
          key: target-deps-${{ hashFiles('Makefile.target-deps') }}

      - name: Restore the host OpenSSL toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-openssl
          key: host-openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/vm-toolchain.sh') }}

      - name: Restore the host libtpms toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-libtpms
          key: host-libtpms-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/vm-toolchain.sh', '.github/scripts/install-libtpms.sh') }}

      - name: Restore the VM images
        if: matrix.suite != 'unit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-vm/cache
          key: test-vm-runtime-and-operator-${{ hashFiles('testing/vm/runtime-packages', 'testing/vm/operator-packages', 'testing/vm/prepare-runtime.sh', 'testing/vm/build-bundle.sh', 'testing/vm/arch.sh', '.github/scripts/install-clang.sh', '.github/scripts/install-static-libcrypto-deps.sh', 'testing/container/Containerfile', 'testing/container/packages', 'Makefile.target-deps') }}

      - name: Prepare the test environment
        id: setup
        env:
          KERNEL_CI_ARTIFACT_DIR: ${{ format('{0}/build/kernel-ci-artifact', github.workspace) }}
        run: .github/scripts/tests.sh setup

      - name: Run selected test suite
        env:
          TEST_SUITE: ${{ matrix.suite }}
          SHIRUDO_SKIP_TREE_CHECKS: ${{ github.event_name == 'push' && '1' || '0' }}
        run: .github/scripts/tests.sh run "$TEST_SUITE"

      # A failing test still leaves counters for the tests that ran.
      - name: Collect the counters of the host and the guests
        id: collect
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .github/scripts/coverage.sh --sudo-container

      - name: Upload the shard tracefile
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage/shirudo.lcov
          if-no-files-found: error
          overwrite: true

  report:
    name: Report coverage
    needs: coverage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the shard tracefiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage/shards

      - name: Merge the shard tracefiles
        run: .github/scripts/coverage.sh merge-ci

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/shirudo.lcov
          format: lcov
