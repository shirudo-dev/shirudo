name: Proofs

# The proofs take hours of CPU, longer than a pull request should wait:
# they run every night on what main holds, and a series runs the ones its
# change reaches before it is sent, as
# Documentation/contribute/testing/proofs.rst says. A failure names its
# proof and the function it reads, so a night of merges needs no
# bisecting.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A run started while the proofs run waits behind them rather than
# cancelling them. GitHub keeps only the newest run waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shard <k> of <n> runs every <n>th proof of proofs.list from the
  # <k>th, but those ci-skip.list names, one at a time: the runner's
  # 7 GB is for one proof, not two. proofs.sh caps each proof's memory
  # and time well within the job's. CBMC reads the headers of the C
  # library and of the libraries the harnesses include through the
  # runner's gcc, so the job runs on the Ubuntu release the proofs are
  # developed on, not the one ubuntu-latest moves to next.
  cbmc:
    name: CBMC
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetching the package from GitHub takes seconds, as long as a
      # cache restore would, so it is not cached.
      - name: Install CBMC
        run: .github/scripts/proofs.sh install-cbmc

      - name: Install the headers the proofs include
        run: .github/scripts/proofs.sh install-headers

      - name: Run the CBMC proofs of shard ${{ matrix.shard }}
        run: .github/scripts/proofs.sh run ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Upload the output of the failed proofs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbmc-logs-${{ matrix.shard }}
          path: build/proofs/
          if-no-files-found: ignore

  lean4:
    name: Lean4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain is 600 MB to fetch and 3 GB unpacked. The key
      # takes proofs.sh, which pins elan's version.
      - name: Restore elan and the Lean toolchain
        id: elan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testing/proofs/lean4/lean-toolchain', '.github/scripts/proofs.sh') }}

      - name: Install elan and the Lean toolchain
        id: install
        run: .github/scripts/proofs.sh install-lean

      # Lake rebuilds each module whose source, imports, options or
      # toolchain differ from the build it restores.
      - name: Restore the Lean build
        id: lake
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testing/proofs/lean4/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testing/proofs/lean4/lean-toolchain', 'testing/proofs/lean4/lakefile.toml', 'testing/proofs/lean4/lake-manifest.json', 'testing/proofs/lean4/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-

      - name: Check the Lean 4 proofs
        id: lean
        run: make proofs-lean4

      - name: Save elan and the Lean toolchain
        if: always() && steps.install.outcome == 'success' && steps.elan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: ${{ steps.elan.outputs.cache-primary-key }}

      # Only a build that passed is kept, so a later run never starts
      # from one that did not.
      - name: Save the Lean build
        if: always() && steps.lean.outcome == 'success' && steps.lake.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testing/proofs/lean4/.lake
          key: ${{ steps.lake.outputs.cache-primary-key }}
