name: AFL++

# The fuzz targets under AFL++, whose comparison logging and mutators find
# inputs libFuzzer does not, for ten minutes a target, every night and by
# hand. A finding comes with its target and the input that crashed it, so
# a night of merges needs no bisecting. The corpus is shared with the
# libFuzzer job of the Sanitizers workflow through the cache: each starts
# from what the newest run of either kept on main.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A run started while one fuzzes waits for it rather than cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  afl-fuzz:
    name: afl-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the LVH OpenSSL toolchain
        id: lvh-openssl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-openssl
          key: host-openssl-lvh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/vm-toolchain.sh') }}

      - name: Restore the AFL++ build
        id: afl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/afl
          key: afl-lvh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/afl-deps.sh') }}

      - name: Restore the fuzz corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-afl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      - name: Fuzz the parsers of input from outside the host with AFL++ in LVH VM
        id: fuzz
        uses: ./.github/actions/lvh
        with:
          test-name: shirudo-afl-fuzz
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ runner.temp }}/lvh
          install-dependencies: true
          cmd: |
            systemctl start host.mount
            cd /host
            .github/scripts/vm-toolchain.sh libclang-rt-23-dev llvm-23-dev
            . build/vm-toolchain.env
            .github/scripts/afl-deps.sh
            PATH=/host/build/afl/bin:\$PATH make -j"\$(nproc)" -C testing afl \
              AFL_SECONDS=600 \
              FUZZ_CORPUS=/host/build/fuzz-corpus

      - name: Save the AFL++ build
        if: always() && steps.afl.outputs.cache-hit != 'true' && hashFiles('build/afl/.built') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/afl
          key: ${{ steps.afl.outputs.cache-primary-key }}

      - name: Save the fuzz corpora
        if: always() && steps.fuzz.outcome != 'skipped' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-afl-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afl-fuzz-crashes
          path: testing/fuzz/crash-afl-*
          if-no-files-found: ignore
