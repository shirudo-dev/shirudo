name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue leaves sparse and Coccinelle to the pull request and
  # the push to main: a change landing first rarely alters what they find.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a pull request supersedes its run. Any other run is
# keyed on its ref and commit, so a merge never cancels another's run.
concurrency:
  group: |
    ${{ github.workflow }}
    ${{ github.event_name }}
    ${{ github.event.pull_request.number || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
          ignore_paths: vendor

  spdx:
    name: SPDX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the SPDX tag of every tracked source
        run: .github/scripts/check-spdx.sh

  unused:
    name: Unused functions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that every extern function has a caller
        run: .github/scripts/check-unused.sh

  sparse:
    name: Sparse
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # sparse reads the sources against OpenSSL 3.5 and the other build
      # dependencies, which the toolchain of the LVH guest the other
      # builds use provides.
      - name: Run sparse over the userspace sources in LVH VM
        uses: ./.github/actions/lvh
        with:
          test-name: shirudo-sparse
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ runner.temp }}/lvh
          install-dependencies: true
          cmd: |
            systemctl start host.mount
            cd /host
            .github/scripts/vm-toolchain.sh sparse
            . build/vm-toolchain.env
            .github/scripts/check-sparse.sh

  coccinelle:
    name: Coccinelle
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Coccinelle
        run: sudo apt-get update && sudo apt-get install -y coccinelle

      # Every semantic patch in testing/coccinelle over the C the project
      # writes; a match fails the job and annotates its line.
      - name: Check the tree against the Coccinelle rules
        run: .github/scripts/check-coccinelle.sh

  checkpatch:
    name: Checkpatch
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The kernel's checkpatch.pl, in strict mode, over the C sources and
      # the message of every commit the event covers; the script fetches
      # the pinned copy it runs.
      - name: Run checkpatch over every commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: .github/scripts/ci-commit-range.sh .github/scripts/check-style.sh
