#
# The collector of the local development stack: what the end-to-end
# collector writes, and every log record also into otel.otel_logs, where
# the backend's schema in the same ClickHouse reads the keepalives.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /certs/server.pem
          key_file: /certs/server.key
exporters:
  file:
    path: /out/otlp.json
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: shirudo
    create_schema: true
  clickhouse/backend:
    endpoint: tcp://clickhouse:9000
    database: otel
    logs_table_name: otel_logs
    create_schema: false
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file, clickhouse, clickhouse/backend]
    metrics:
      receivers: [otlp]
      exporters: [file, clickhouse]
