# Use the arm64 page size used by the target kernel. [S]
CONFIG_ARM64_4K_PAGES=y
# The QEMU virt machine uses generic PCI for its disks, network and 9p
# shares, and a PL011 for the ttyAMA0 console. [S]
CONFIG_PCI_HOST_GENERIC=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
# arm64 ftrace direct calls require call-ops support. [S]
CONFIG_DYNAMIC_FTRACE_WITH_CALL_OPS=y
